<!DOCTYPE html>
<html class="antialiased scroll-smooth" lang="pt-BR">
<head>
    <title>Leticia Argente</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Emagrecimento saudável e reeducação alimentar com acompanhamento humano, individualizado e sem dietas restritivas">
    <link rel="icon" href="../static/images/favicon.png" type="image/png" sizes="192x192">
    <link rel="stylesheet" href="../src/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Julius+Sans+One&family=Jost:wght@300;400;500;600&display=swap">
</head>
<body class="bg-cream font-body text-slate-800">

    <!-- ==================== HERO DE CONFIRMAÇÃO ==================== -->
    <section id="inicio" class="relative flex justify-center items-center min-h-screen overflow-hidden">
        <div class="absolute inset-0 bg-linear-to-br from-slate-800 to-olive-700"></div>
        <video class="absolute inset-0 size-full object-[80%_50%] object-cover lg:object-center" preload="auto" autoplay muted loop playsinline id="background-video">
            <source src="../static/videos/background.mp4" type="video/mp4">
        </video>
        <div class="absolute inset-0 bg-linear-to-b from-slate-900/75 via-slate-900/55 to-slate-900/30"></div>
        <div class="z-10 relative mx-auto px-4 py-16 max-w-4xl text-cream text-center">
            <span class="inline-flex justify-center items-center bg-clay-500 mb-8 rounded-full ring-8 ring-cream/10 size-20 text-cream card-in">
                <svg class="size-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/>
                </svg>
            </span>
            <p class="mb-8 text-clay-300 text-xs uppercase tracking-[0.3em]">Pagamento confirmado</p>
            <h1 class="font-display text-4xl md:text-6xl lg:text-7xl uppercase">OBRIGADA POR DAR<br>ESSE PRIMEIRO PASSO</h1>
            <p class="mx-auto mt-8 max-w-xl text-cream/85 text-xl">A partir de agora seguimos pelo WhatsApp, você vai receber uma mensagem automática com os próximos passos</p>
            <div class="flex flex-wrap justify-center gap-4 mt-8">
                <a href="https://wa.me/message/IEXHIVQ2J76VA1" target="_blank" rel="noopener" class="bg-clay-500 hover:bg-clay-600 px-8 py-4 rounded-full text-cream whitespace-nowrap transition duration-300">Falar no WhatsApp</a>
                <a href="../index.html#inicio" class="hover:bg-cream/10 px-8 py-4 border border-cream/60 rounded-full text-cream whitespace-nowrap transition duration-300">Voltar ao site</a>
            </div>
        </div>
    </section>

    <script>
        document.addEventListener("visibilitychange", () => {
            const video = document.getElementById("background-video")
            video.load()
            video.play()
        })
    </script>
</body>
</html>
