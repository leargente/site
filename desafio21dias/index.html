<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Desafio encerrado · Letícia Argente Nutricionista</title>
<link href="https://fonts.googleapis.com/css2?family=Julius+Sans+One&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--cream:#f6f1ea;--terracotta:#b8624a;--olive:#7a8a5a;--slate:#5c6b78;--graphite:#2e2e2e;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--cream);color:var(--graphite);font-family:'Jost',sans-serif;font-weight:300;text-align:center;padding:24px}
  .box{max-width:520px}
  .label{font-size:.75rem;letter-spacing:.35em;text-transform:uppercase;color:var(--slate);margin-bottom:20px}
  h1{font-family:'Julius Sans One',sans-serif;font-weight:400;font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.25;margin-bottom:18px}
  p{font-size:1.05rem;line-height:1.7;margin-bottom:34px;color:#4a4a4a}
  .line{width:48px;height:1px;background:var(--terracotta);margin:0 auto 28px}
  a.btn{display:inline-block;padding:14px 32px;border:1px solid var(--graphite);color:var(--graphite);text-decoration:none;font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;transition:.25s}
  a.btn:hover{background:var(--graphite);color:var(--cream)}
  .ig{display:block;margin-top:22px;font-size:.9rem;color:var(--olive);text-decoration:none}
</style>
</head>
<body>
  <div class="box">
    <div class="label">Construindo Sua Melhor Versão</div>
    <h1>As inscrições desta edição estão encerradas</h1>
    <div class="line"></div>
    <p>Obrigada a todas as pessoas que participaram. A próxima edição será anunciada no Instagram.</p>
    <a class="btn" href="https://www.leargente.com.br/">Voltar ao site</a>
    <a class="ig" href="https://www.instagram.com/leargente">@leargente</a>
  </div>
</body>
</html>
